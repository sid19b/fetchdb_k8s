server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # 1. ADD THIS CRUCIAL BLOCK: Prevents frontend Nginx from handling API requests.
    location /api/ {
        # Returning a 404 ensures the request is not processed by try_files 
        # and allows the browser to correctly send the API call back to the Ingress.
        return 404; 
    }

    # 2. Serve React SPA for all other frontend routes
    location / {
        try_files $uri /index.html;
    }

    # Optional static caching
    location /static/ {
        expires 1y;
        add_header Cache-Control "public";
    }
}